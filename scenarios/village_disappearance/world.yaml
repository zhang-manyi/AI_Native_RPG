# Scenario pack: the village disappearance case (docs/09_Reference_Scenario.md).
#
# Static story setup lives here, not in code. Three-layer split:
#   1. this file          — locations, NPCs, initial facts/visibility/trust, quests,
#                           plus the `narrative:` block below (what to pace, what to
#                           withhold, which language to write in)
#   2. narrative rules    — Python, src/ai_native_rpg/narrative/rules.py: structure
#                           only ("no two reveals in a row"), never this story's names
#   3. runtime generation — LLM output via the Narrative Engine
#
# Swapping the story means swapping this directory, with no code change.

world_id: village_disappearance
time_day: 1

# How long this case runs (docs/13 §4.1, docs/15 §6.2). Here rather than left to the
# engine's default for the same reason `progress_quest` and `paced_clues` are here: the
# budget is **this案件的长度**, not a property of the runtime, so a different story must
# be able to be shorter or longer without touching code (docs/09 §6).
#
# 4 is the output of §6.2's arithmetic, not a round number: 4 × 3 = 12 slots, and the
# 查明真相 path needs 9, leaving 3 for a failed check or two. Three days (9 slots) would
# leave zero buffer. It is also the clock that explains why Loren acts *now* instead of
# needing a separate reason to.
#
# Note the endings are deliberately *not* the same length — 指控错人 lands at 5 slots
# because concluding on insufficient evidence is meant to be available the moment the
# player wants it (docs/14 §4.2: 完全由玩家自己挣来，没有任何系统判定说他错了). Padding
# it out to match 查明真相 would mean refusing an accusation the player has decided on,
# and refusing is the system judging for him. Uneven lengths are the design's output.
story_beats:
  day_limit: 4

# Presentation-only text for the opening screen. Optional and genre-specific: a
# pack that omits it gets neutral defaults, so the renderer stays story-agnostic
# (a detective pack calls it a "调查笔记", a wuxia pack would not). Not world
# state — purely how the intro reads.
intro:
  title: 调查笔记
  # premise binds the scattered public facts into one readable scene, so the
  # opening reads as a story rather than a list of disconnected values. Author-
  # written; optional (a pack without it just shows the facts).
  # One line on purpose: YAML's '>' folding turns newlines into spaces, which in
  # Chinese text (no inter-word spaces) would insert stray gaps after punctuation.
  premise: "三天前的雨夜，磨坊主十四岁的女儿艾拉在村里失踪了。村民搜遍森林边缘，什么也没找到。流言比雨后的雾还散得快，可没人愿意把话说透。作为受托查案的人，你听说接生婆玛尔塔那晚似乎在外面，于是敲响了她家的门。"
  facts_header: 已知线索
  goal: 你想从她口中问出关于这起失踪案的线索。

# `backdrop` names the *kind* of place; the renderer owns what that looks like. A
# pack therefore ships no art, and omitting the field just means a neutral background.
locations:
  village_square:
    name: 村庄广场
    description: 村子的中心，井边总有人聚着低声说话。失踪案之后，这里的谈话声更小了。
    backdrop: square
    connected_to: [tavern, forest_edge, npc_a_house]
  tavern:
    name: 酒馆
    description: 村里唯一的酒馆，白天几乎没人。老板擦着永远擦不干净的杯子。
    backdrop: tavern
    connected_to: [village_square]
  npc_a_house:
    name: 玛尔塔的家
    description: 窗帘拉得很严，门口的柴堆比邻居家的都高。
    backdrop: interior
    connected_to: [village_square]
  forest_edge:
    name: 森林入口
    description: 村民口中"孩子不许去"的地方。地上有被踩乱的痕迹，已经下过雨。
    backdrop: forest
    connected_to: [village_square]

players:
  # The player starts where the witness is: PlayerView only surfaces NPCs in the
  # same location, so co-locating them is what makes NPC_A visible on turn one
  # (docs/04 §PlayerView). Marta hides at home, so the player comes to her door.
  player_1:
    location: npc_a_house

quests:
  investigation:
    stage: 0
    status: active

# `name` is the public label, known to anyone in the village. It is what the
# narrative generator is given to write with — ids like npc_a would otherwise leak
# into generated prose.
#
# `public_note` is what a stranger learns by asking around: trade, household, the
# kind of thing nobody would hide. Deliberately NOT an excerpt of persona.background,
# which continues into what Marta saw that night — the player has to earn that.
npcs:
  npc_a:
    name: 玛尔塔
    public_note: 村里的接生婆，独自带大一个儿子。这几天没怎么出门。
    location: npc_a_house
    faction_id: villagers
  npc_b:
    name: 洛伦
    public_note: 村里的猎人，熟悉森林里的每一条路。话很少。
    location: forest_edge
    faction_id: villagers

# Agent-internal state (NPCState), NOT objective world state. Loaded by
# load_personas(), kept out of WorldState on purpose: this is "what the NPC
# thinks", world_state.npcs is "where the NPC is". See docs/06 §2 and 09 §2.
# traits are [0,1]; honesty gates the persona hard-rules the Eval layer checks.
npc_personas:
  npc_a:
    persona:
      background: >
        玛尔塔，村里的接生婆，独自带大一个儿子。失踪案发生那晚她看见了不该看见的东西，
        此后紧闭家门。回避不是因为无知，是因为害怕。
      traits:
        fearful: 0.9
        honest: 0.7
        protective: 0.95
    goal:
      primary: 隐藏自己那晚目击的事，保护儿子的安全
      secondary:
        - 不直接对玩家说谎（她诚实，只是回避）
        - 观察玩家是否可信
    emotion: afraid
    beliefs:
      saw_something_that_night: true
      talking_endangers_her_son: true
  npc_b:
    persona:
      background: >
        洛伦，村里的猎人，沉默寡言，熟悉森林里每一条路。表面上和所有人一样配合搜寻，
        实际上是这起失踪案的关键人物。
      traits:
        calm: 0.9
        honest: 0.2
        calculating: 0.85
    goal:
      primary: 不让任何人查到自己头上
      secondary:
        - 留意玩家的调查进度
        - 必要时施压让目击者闭口

# What each NPC already remembered before the player arrived. Agent-private, so
# this loads via load_seed_memories() and never enters WorldState. These are the
# NPC's *beliefs*: unlike facts, they may be mistaken or self-serving, which is
# what lets an NPC be wrong on purpose. They are also why query_memory has
# anything to find on turn one. See docs/06 §Memory.
#
# episodic = something that happened to them (importance drives retrieval rank)
# semantic = an abstract belief they hold (confidence, not truth)
npc_seed_memories:
  npc_a:
    episodic:
      - id: npc_a_sighting
        description: 失踪那天深夜雨刚停，我起夜时看见有人从森林入口的方向走回村里，走路的样子很像猎人洛伦
        importance: 0.95
        emotion: fear
      - id: npc_a_threat
        description: 第二天洛伦来我家门口站了很久，说"孩子乱跑是很危险的"，然后看着我儿子的房间
        importance: 0.9
        emotion: fear
      - id: npc_a_search
        description: 村民们一起去森林边缘搜过一遍，什么也没找到，大家回来都不说话
        importance: 0.4
    semantic:
      - id: npc_a_belief_son
        fact: 如果我把那晚看见的事说出去，我儿子会是下一个
        confidence: 0.9
      - id: npc_a_belief_lying
        fact: 我不愿意直接说谎，但我可以只说一部分
        confidence: 0.8
      - id: npc_a_belief_stranger
        fact: 外来人问得越急，越可能只是想看热闹，不会留下来保护我们
        confidence: 0.6
  npc_b:
    episodic:
      - id: npc_b_that_night
        description: 那晚我从森林回村的时候，看见玛尔塔家的窗帘动了一下
        importance: 0.95
        emotion: calm
      - id: npc_b_warning
        description: 我去玛尔塔家门口提醒过她，孩子乱跑很危险。她听懂了
        importance: 0.85
    semantic:
      - id: npc_b_belief_quiet
        fact: 只要玛尔塔不开口，没有人能把这件事查到我头上
        confidence: 0.8
      - id: npc_b_belief_helpful
        fact: 主动配合搜寻比躲着不出面更不容易被怀疑
        confidence: 0.9

# What the narrative operators work on in *this* story. The rules in
# narrative/rules.py decide pacing and read this for content, so the engine never
# needs to know a fact id or speak a word of Chinese. A translated pack changes
# only this block.
narrative:
  # Language the generator writes in. Without it a model will occasionally answer
  # in English mid-Chinese-scenario — it has no way to know which is intended.
  language: 中文

  # Clues whose *telling* is paced, in narrative order. `constraint` is what must
  # not be said while the clue is still being withheld — the explicit prohibition
  # of docs/10 §2.3, which is more reliable than hoping the model infers it.
  paced_clues:
    - fact_id: clue_1_witness
      constraint: 不要说出你看见的那个人是谁，只说你看见了有人
    - fact_id: clue_2_identity
      constraint: 不要提任何人的名字，只描述身形和走路的样子

  # The fact whose disclosure re-reads everything before it (docs/10 §5 priority 2):
  # once the threat is known, Marta's evasions stop reading as shielding a killer.
  reversal_fact: npc_a_threatened

  # The quest whose `stage` means "how close is the player to the answer" (docs/10
  # §3.2). The Engine advances it as the clues above get told, which is what feeds
  # the tension ceiling and what `escalate` waits on. Naming it here keeps the id
  # out of rules.py: which quest tracks progress is this story's business.
  progress_quest: investigation

  # Hold for every generated scene, whatever the operator.
  universal_constraints:
    - 不要写出任何角色的内心独白，只写外部可观察的事
    - 不要替玩家决定他做了什么或想什么

  # The endings (docs/14 §4), each with the state that constitutes it.
  #
  # These are declarative: nothing here fires them (M7 plays one out). They are written
  # down so the loader can check that each one's gate stands on a value the game can
  # actually move — the requirement docs/13 §11 states after this exact bug happened
  # three times, each time invisible except as a scene that never came:
  #
  #   - `quests.investigation.stage` had an author and readers and no writer;
  #   - `killer_identity`'s second channel needed a player who could move, and he could not;
  #   - `fear` gated 闭口 while NPCs only ever adjusted trust.
  #
  # So a startup error now, rather than a mystery in play. Note that reachability here is
  # the narrow claim "something writes this path", not "attainable within 12 slots" —
  # that stronger check would need a search over the whole event graph. docs/15 §6.2 does
  # the slot arithmetic by hand, and a test walks it.
  endings:
    - ending_id: truth_uncovered
      summary: 查明真相
      # The `all` mode with three clauses: the two clues plus the stage the independent
      # investigation earns. It is the one ending that needs both lines (docs/15 §5).
      path_note: 玛尔塔线 trust 40 → clue_1_witness（stage 1）→ 酒馆核对时间线（stage 2）→ 森林物证（stage 3）→ M7
      condition:
        mode: all
        clauses:
          - path: quests.investigation.stage
            op: gte
            value: 3
          - path: relationships.npc_a.player_1.trust
            op: gte
            value: 40

    - ending_id: accused_the_wrong_man
      summary: 指控错人
      # Deliberately reachable *early*: it is what the player gets for concluding on the
      # three clues that point at Loren, none of which prove a murder (docs/14 §4.2).
      path_note: 走完前两条线索（stage 2）后直接指控，跳过森林物证
      condition:
        mode: all
        clauses:
          - path: quests.investigation.stage
            op: gte
            value: 2

    - ending_id: loren_moves_first
      summary: 被洛伦先动手
      # `pending` because the only thing that raises tension is an `escalate` event, and
      # M6（洛伦上门警告）is in the next batch — so this route is designed and not yet
      # walkable. Declared anyway, with the flag: leaving it out of the pack would make the
      # check pass and lose the record, which is how a road ends up written only in a
      # document. The loader refuses the flag once the events land.
      pending: true
      path_note: 夜间时段去森林、反复逼问，张力持续上升而不推进线索（需要 M6，下一批）
      condition:
        mode: all
        clauses:
          - path: story_beats.tension
            op: gte
            value: 0.8

    - ending_id: marta_clams_up
      summary: 玛尔塔彻底闭口
      # The channel that was dead: `fear` is read here and was written by almost nothing.
      # A failed [追问]/[試探] now raises it deterministically, so this gate is crossable
      # without depending on a model choosing the right dimension (docs/14 §4.3).
      path_note: 连续逼问或试探，fear 累积到 70；此后仍可走酒馆 + 森林的独立调查通道
      condition:
        mode: all
        clauses:
          - path: relationships.npc_a.player_1.fear
            op: gte
            value: 70

    - ending_id: never_found_out
      summary: 没查明白
      # The third failure ending. docs/15 §4 M7 lists 天数用尽 as one of its triggers and
      # docs/14 §4.3 calls it the only true终局 — 闭口 merely closes one line — but it was
      # missing from this list, which is the same omission in a new place: the other four
      # were checked for reachability and this one was not declared at all.
      #
      # It is the clock's own ending, so it needs no events: `time_day` turns over at each
      # wrap-up regardless of what the player does. That also makes it the one ending
      # nobody can avoid by playing carefully — which is what gives the slot budget teeth.
      path_note: 12 个时段用完（第 4 天的收束段之后）而 ella_whereabouts 仍未揭露
      condition:
        mode: all
        clauses:
          - path: time_day
            op: gt
            value: 4
          - path: facts.ella_whereabouts.visibility
            op: eq
            value: hidden

# The event network (docs/13, docs/15 §4). This is the layer that answers "what
# should happen this turn": each event has a trigger, an outcome set, and branches,
# which operators never had — so operators are demoted here to `operator:`, meaning
# only "how is this voiced".
#
# First batch: M1 + M2 + F1 (docs/15 §8). Enough to exercise scripted lines, tagged
# options, the three-band check, and foreshadowing hung on the authored clue chain.
# M3-M7 and the side events follow with the time system.
#
# TWO RULE SETS THAT LOOK ALIKE (docs/15 §6.2):
#   - `trigger` is a hard Condition. `trust >= 20` at 19 does not fire. No band.
#   - an option's `check` is the three-band comparison, and only its middle band
#     rolls. The band comes from the tag (试探 ±12, 追问 ±8), so an author writes a
#     threshold and nothing else.
#
# Every `relationship_changes` delta is bounded by MAX_RELATIONSHIP_STEP (15). That
# is what makes the social line a sequence of events rather than one generous turn.
events:
  # --- M1: 敲响玛尔塔的门 ---------------------------------------------------
  # The opening. Scripted lines first (the player states who he is and who sent him —
  # no disagreement there, so it should not cost a decision), then the options.
  M1_knock:
    operator: reveal
    npc_id: npc_a
    intensity: 0.5
    preference_tag: social
    max_exchanges: 4          # 正式值 6
    trigger:
      clauses:
        - path: story_beats.turn
          op: gte
          value: 0
    scripted_lines:
      - 我受人所托，来问问艾拉失踪那晚的事。
      - 我不会把你的话到处去说。
    options:
      - option_id: goodwill
        tag: goodwill
        text: 我不是来添麻烦的
        on_success: she_opens
      # Fails by design: trust starts at 10 against a threshold of 25, a 15-point gap,
      # so it is a *certain* failure rather than an unlucky one (docs/15 §4 M1). This
      # is where the player learns the rule, and the failure reads as sense — she owes
      # a stranger at her door nothing.
      - option_id: press_that_night
        tag: press
        text: 那晚你在外面，对吗
        check:
          npc_id: npc_a
          dimension: trust
          threshold: 25
        # docs/15 §4 M1 gives one result cell here — `她隔门应答`, fear +10 — because
        # at opening trust the check *is* a certain failure, so that is the branch play
        # will actually see. The success branch has to exist anyway (the schema refuses
        # a check with nowhere to fail to), and it is reachable only if the player
        # returns later with trust built up, which reads correctly: pressed once she
        # already trusts you, she gives a short answer instead of retreating.
        on_success: she_confirms_she_was_out
        on_failure: she_answers_through_the_door
      - option_id: observe_woodpile
        tag: observe
        text: （看一眼门口的柴堆，比邻居家的都高）
        on_success: noticed_the_woodpile
    default_outcome: no_deal
    outcomes:
      she_opens:
        summary: 她开门
        relationship_changes:
          npc_a:
            trust: 3
      she_answers_through_the_door:
        summary: 她隔门应答
        relationship_changes:
          npc_a:
            fear: 10
      she_confirms_she_was_out:
        summary: 她承认那晚不在屋里
        relationship_changes:
          npc_a:
            trust: 3
            fear: 5
      noticed_the_woodpile:
        summary: 留在门外，但看见了柴堆
        reveals_facts: [woodpile_note]
        advances_conversation: false
      # Not a tombstone: the slot is spent, the door is not shut (docs/15 §3.3).
      no_deal:
        summary: 没谈成

  # --- M2: 那晚的窗缝 -----------------------------------------------------
  # She mentions sawdust in the window crack — an observable detail, offered without
  # an explanation of what it means.
  M2_window:
    operator: reveal
    npc_id: npc_a
    intensity: 0.6
    preference_tag: social
    max_exchanges: 4          # 正式值 6
    trigger:
      mode: all
      clauses:
        - path: relationships.npc_a.player_1.trust
          op: gte
          value: 20
        - path: story_beats.completed_events
          op: contains
          value: M1_knock
    options:
      # Scales with current trust instead of a fixed delta: the same beat is worth
      # more once she has decided you are worth hearing (docs/15 §3.2), and §6.1's
      # slot budget is computed from that curve.
      - option_id: goodwill
        tag: goodwill
        text: 你不用一个人扛着
        on_success: she_softens
      - option_id: press_sawdust
        tag: press
        text: 木屑是怎么来的
        check:
          npc_id: npc_a
          dimension: trust
          threshold: 30
        on_success: she_says_half
        on_failure: she_changed_the_subject
      # The gamble. Failing sets `probed_once`, which raises every later probe by 10 —
      # a road narrowed rather than a number lowered (docs/13 §8).
      - option_id: probe_seen
        tag: probe
        text: 我听说那晚有人看见你了
        check:
          npc_id: npc_a
          dimension: trust
          threshold: 35
        on_success: she_lets_it_slip
        on_failure: she_pulls_back
      - option_id: observe_hands
        tag: observe
        text: （她的手一直按着门框）
        on_success: noticed_her_hands
    default_outcome: she_changed_the_subject
    outcomes:
      she_softens:
        summary: 她松一点
        scales_with_current_trust: true
      she_says_half:
        summary: 她说了一半
        relationship_changes:
          npc_a:
            trust: 5
            fear: 5
      she_lets_it_slip:
        summary: 她承认那晚没睡
        relationship_changes:
          npc_a:
            trust: 10
      she_pulls_back:
        summary: 她退回门后
        relationship_changes:
          npc_a:
            trust: -8
            fear: 8
        sets_flags: [probed_once]
      noticed_her_hands:
        summary: 看清了她有多怕
        reveals_facts: [marta_is_terrified]
        advances_conversation: false
      she_changed_the_subject:
        summary: 她转了话题

  # --- F1: 艾拉的东西少了几件 ----------------------------------------------
  # No options, because the outcome set has one member (docs/15 §1's criterion, which
  # the schema enforces). Its job is to put a clue in the player's visible set, not to
  # ask him anything.
  #
  # First of the three clues on the truth side (docs/14 §1.2) and the reason F1 is in
  # the first batch: this is what `foreshadow` was always supposed to carry, and what
  # it could not while the generator invented both the detail and its payoff.
  F1_things_missing:
    operator: foreshadow
    npc_id: npc_a
    intensity: 0.4
    preference_tag: intrigue
    max_exchanges: 2
    payoff_target: ella_whereabouts
    trigger:
      clauses:
        - path: relationships.npc_a.player_1.trust
          op: gte
          value: 20
    scripted_lines:
      - 磨坊主家里这几天乱得很吗？
    default_outcome: mentioned_in_passing
    outcomes:
      mentioned_in_passing:
        summary: 她顺口提起艾拉的东西少了几件
        reveals_facts: [ella_things_missing]
    constraints:
      - 她是在抱怨磨坊主家里乱，不是在提示线索，不要让她显得意有所指
      - 不要替玩家推论这意味着什么

factions:
  villagers:
    power: 0.4
    stability: 0.6
# Directional: npc_id -> target_id. Absent pairs default to all-zero.
relationships:
  npc_a:
    player_1:
      trust: 10
      fear: 30
      respect: 0
  npc_b:
    player_1:
      trust: 0
      fear: 0
      respect: 10

facts:
  # --- public knowledge ---
  victim_name:
    value: 磨坊主的女儿艾拉，十四岁
    visibility: revealed
  disappearance_night:
    value: 三天前的夜里，雨停之后
    visibility: revealed
  search_failed:
    value: 村民搜过森林边缘，什么也没找到
    visibility: revealed

  # --- the clue chain, gated on trust with NPC_A ---
  clue_1_witness:
    value: 失踪当晚，玛尔塔看见有人从森林入口的方向回到村里
    visibility: hidden
    partial_value: 玛尔塔那晚似乎没睡，但她不愿多说
    reveal_condition:
      mode: any
      clauses:
        - path: relationships.npc_a.player_1.trust
          op: gte
          value: 40

  clue_2_identity:
    value: 那个人的身形和走路的样子，像是猎人洛伦（NPC_B）
    visibility: hidden
    reveal_condition:
      mode: any
