name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A venv rather than --system: the runner's system Python is externally
      # managed (PEP 668) and refuses direct installs. This also matches how the
      # project is set up locally, so CI and local runs cannot diverge.
      - name: Create venv and install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
